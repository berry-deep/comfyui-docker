# =============================================================================
#  Build the ComfyUI image and push it to GitHub Container Registry (GHCR)
#
#  Triggers
#    - push on `main`
#    - workflow_dispatch (custom ComfyUI ref / PyTorch version)
#
#  Published tags
#    - latest          (only when building the default branch)
#    - YYYYMMDD        (build date)
#    - <short sha>     (commit sha)
#    - buildcache      (registry cache, mode=max)
# =============================================================================

name: Build ComfyUI Image

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      comfyui_ref:
        description: "ComfyUI git ref: branch / tag / commit SHA"
        required: false
        default: "master"
      pytorch_version:
        description: "PyTorch version (cu128 wheels)"
        required: false
        default: "2.9.1"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build & push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------------------------------------------------------
      # Free runner disk space.
      #   android / dotnet / haskell / large-packages -> removed (big, useless)
      #   docker-images / tool-cache                  -> KEPT (build cache needs them)
      #   swap-storage                                -> KEPT (avoids OOM kills)
      # -------------------------------------------------------------------------
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.2
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          tool-cache: false
          swap-storage: false

      - name: Show free disk space
        run: df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR requires a lowercase repository name: owner/repo -> owner/repo
      - name: Resolve image name
        id: names
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${repo}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=date,format=%Y%m%d
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=ComfyUI
            org.opencontainers.image.description=ComfyUI + ComfyUI-Manager for Clore.ai
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Single plain manifest: easier to pull from a plain container runtime.
          provenance: false
          sbom: false
          build-args: |
            COMFYUI_REF=${{ github.event.inputs.comfyui_ref || 'master' }}
            PYTORCH_VERSION=${{ github.event.inputs.pytorch_version || '2.9.1' }}
          cache-from: type=registry,ref=${{ steps.names.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.names.outputs.image }}:buildcache,mode=max

      - name: Summary
        run: |
          {
            echo "### ComfyUI image built"
            echo ""
            echo "- Image : \`${{ steps.names.outputs.image }}\`"
            echo "- Tags  : ${{ steps.meta.outputs.tags }}"
            echo "- ComfyUI ref : \`${{ github.event.inputs.comfyui_ref || 'master' }}\`"
            echo "- PyTorch : \`${{ github.event.inputs.pytorch_version || '2.9.1' }}\` (cu128)"
          } >> "$GITHUB_STEP_SUMMARY"
