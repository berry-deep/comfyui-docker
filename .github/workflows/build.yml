# =============================================================================
#  Build the ComfyUI image and push it to GitHub Container Registry (GHCR)
#
#  Triggers
#    - push on `main`
#    - workflow_dispatch (custom ComfyUI ref / PyTorch version)
#
#  Published tags
#    - latest          (only when building the default branch)
#    - YYYYMMDD        (build date)
#    - <short sha>     (commit sha)
#    - buildcache      (registry cache, mode=max)
# =============================================================================

name: Build ComfyUI Image

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      comfyui_ref:
        description: "ComfyUI git ref: branch / tag / commit SHA"
        required: false
        default: "master"
      pytorch_version:
        description: "PyTorch version (cu128 wheels)"
        required: false
        default: "2.9.1"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build & push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------------------------------------------------------
      # Free runner disk space.
      #   android / dotnet / haskell / large-packages -> removed (big, useless)
      #   docker-images / tool-cache                  -> KEPT (build cache needs them)
      #   swap-storage                                -> KEPT (avoids OOM kills)
      # -------------------------------------------------------------------------
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.2
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          tool-cache: false
          swap-storage: false

      - name: Show free disk space
        run: df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR requires a lowercase repository name: owner/repo -> owner/repo
      # NOTE: the tags are computed here on purpose. docker/metadata-action has
      # no `date` tag type (v5 and v6 only know ref/pr/semver/match/sha/raw/
      # pep440/latest/edge/schedule), so the YYYYMMDD tag is built manually.
      - name: Resolve image name and tags
        id: names
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY,,}"
          image="${REGISTRY}/${repo}"
          short_sha="${GITHUB_SHA::7}"
          date_tag="$(date -u +%Y%m%d)"
          tags="${image}:latest,${image}:${date_tag},${image}:${short_sha}"
          echo "repo=${repo}"              >> "$GITHUB_OUTPUT"
          echo "image=${image}"            >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}"    >> "$GITHUB_OUTPUT"
          echo "date_tag=${date_tag}"      >> "$GITHUB_OUTPUT"
          echo "tags=${tags}"              >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Fail fast (and with a readable message) if the base image tag is wrong,
      # instead of dying inside the build with a "manifest unknown" error.
      - name: Verify base image
        run: |
          set -euo pipefail
          if docker manifest inspect cloreai/jupyter:ubuntu24.04-v2 > /dev/null 2>&1; then
            echo "base image OK: cloreai/jupyter:ubuntu24.04-v2"
          else
            echo "::error::base image cloreai/jupyter:ubuntu24.04-v2 not found on Docker Hub"
            echo "::error::check the available tags: https://hub.docker.com/r/cloreai/jupyter/tags"
            exit 1
          fi

      # metadata-action is kept for the OCI labels only (its tag types are not
      # used: the tag list comes from the step above).
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.image }}
          labels: |
            org.opencontainers.image.title=ComfyUI
            org.opencontainers.image.description=ComfyUI + ComfyUI-Manager for Clore.ai
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Single plain manifest: easier to pull from a plain container runtime.
          provenance: false
          sbom: false
          build-args: |
            COMFYUI_REF=${{ github.event.inputs.comfyui_ref || 'master' }}
            PYTORCH_VERSION=${{ github.event.inputs.pytorch_version || '2.9.1' }}
          cache-from: type=registry,ref=${{ steps.names.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.names.outputs.image }}:buildcache,mode=max

      - name: Summary
        run: |
          {
            echo "### ComfyUI image built"
            echo ""
            echo "- Image : \`${{ steps.names.outputs.image }}\`"
            echo "- Tags  : ${{ steps.names.outputs.tags }}"
            echo "- Date tag : \`${{ steps.names.outputs.date_tag }}\`"
            echo "- Short sha : \`${{ steps.names.outputs.short_sha }}\`"
            echo "- ComfyUI ref : \`${{ github.event.inputs.comfyui_ref || 'master' }}\`"
            echo "- PyTorch : \`${{ github.event.inputs.pytorch_version || '2.9.1' }}\` (cu128)"
          } >> "$GITHUB_STEP_SUMMARY"
